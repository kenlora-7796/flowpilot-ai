<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowPilot AI | Tierra AI Labs</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><header><p class="eyebrow">TIERRA AI LABS · WORKFLOW STUDIO</p><h1>FlowPilot <span>AI</span></h1><p class="sub">Turn your next big business task into a clear plan.</p></header>
<section class="panel"><label for="request">What do you need to get done?</label><textarea id="request" maxlength="1500" rows="4" placeholder="Example: Plan a grand opening for my small business"></textarea><div class="actions"><button id="generate">Generate workflow <span aria-hidden="true">→</span></button><span id="status" role="status" aria-live="polite">Ready when you are.</span></div></section>
<section class="results" aria-labelledby="results-heading"><div class="results-head"><h2 id="results-heading">Your action plan</h2><span id="mode" class="mode" hidden></span></div><div id="translation-controls" class="translation-controls" hidden><label for="language">Task language</label><select id="language"><option value="en">English</option><option value="es">Español</option></select><button id="translate" type="button">Translate</button><span id="translation-status" role="status" aria-live="polite"></span></div><p id="empty">Your prioritized tasks will appear here.</p><ol id="tasks"></ol></section>
<footer>Built with intention by Tierra AI Labs · FlowPilot AI POC</footer></main><script src="/app.js" defer></script></body></html>
